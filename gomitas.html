<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomitas Personalizadas</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #f87451;
            --secondary-color: #ed8c56;
            --accent-color: #e3a45b;
            --gold-color: #d9bd61;
            --background-light: #fff2fe;
            --text-dark: #333333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffab70, #f87451, #fd6b4d);
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, transparent, var(--primary-color) 20%, transparent 80%);
            transform: rotate(-45deg);
            z-index: -1;
            opacity: 0.1;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
        }

        h3 {
            color: var(--accent-color);
            margin: 15px 0;
        }

        .sabores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .sabor {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .sabor:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .sabor img {
            max-width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            border: 3px solid var(--gold-color);
        }

        .sabor:hover img {
            transform: scale(1.1);
        }

        .sabor p {
            color: var(--text-dark);
            font-weight: 500;
            margin: 8px 0;
        }

        .sabor button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            font-weight: bold;
        }

        .sabor button:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }

        #carrito {
            background-color: var(--background-light);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        #lista-carrito {
            list-style-type: none;
            margin-bottom: 15px;
        }

        #lista-carrito li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        #lista-carrito li button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #lista-carrito li button:hover {
            background-color: #ff3333;
            transform: scale(1.05);
        }

        #telefono {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #telefono:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(227, 164, 91, 0.3);
        }

        #total {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: right;
            color: var(--primary-color);
            margin: 15px 0;
            padding: 10px;
            border-top: 2px dashed var(--gold-color);
        }

        #enviar {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #enviar:hover {
            background-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        #enviar:active {
            transform: translateY(1px);
        }

        /* Estilo para el cuadro de "Sobre Nosotros" */
        .sobre-nosotros-box {
            position: fixed;
            top: 30px;
            right: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid var(--accent-color);
        }

        .sobre-nosotros-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .sobre-nosotros-btn {
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sobre-nosotros-btn i {
            margin-right: 8px;
        }

        .sobre-nosotros-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .sabores {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 20px 15px;
            }
            
            .sobre-nosotros-box {
                top: 10px;
                right: 10px;
                padding: 10px;
            }
            
            .sobre-nosotros-btn {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Botón "Sobre Nosotros" fijo -->
    <div class="sobre-nosotros-box">
        <a href="index.html" class="sobre-nosotros-btn">
            <i class="fas fa-info-circle"></i> Sobre Nosotros
        </a>
    </div>
    
    <div class="container">
        <h1>🍬 Gomitas Personalizadas 🍬</h1>
        <h2>Elige tus Gomitas Favoritas</h2>
        
        <div class="sabores" id="sabores">
            <div class="sabor" data-sabor="panditas" data-precio="10">
                <img src="productos/gomitas.jpg" alt="Gomitas Panditas">
                <p>Panditas</p>
                <p><strong>$10</strong></p>
                <button onclick="agregarAlCarrito('Panditas', 10)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="sabor" data-sabor="mango" data-precio="10">
                <img src="productos/mango.jpg" alt="Gomitas de Mango">
                <p>Mango</p>
                <p><strong>$10</strong></p>
                <button onclick="agregarAlCarrito('Mango', 10)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="sabor" data-sabor="Rompope" data-precio="10">
                <img src="productos/rompopr.jpg" alt="Gomitas de Rompope">
                <p>Rompope</p>
                <p><strong>$10</strong></p>
                <button onclick="agregarAlCarrito('Rompope', 10)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="sabor" data-sabor="gusano" data-precio="10">
                <img src="productos/gusano.jpg" alt="Gomitas de gusano">
                <p>gusano</p>
                <p><strong>$10</strong></p>
                <button onclick="agregarAlCarrito('gusano', 10)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="sabor" data-sabor="durazno" data-precio="10">
                <img src="productos/durazno.jpg" alt="Gomitas de durazno">
                <p>durazno</p>
                <p><strong>$10</strong></p>
                <button onclick="agregarAlCarrito('durazno', 10)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            <div class="sabor" data-sabor="Sandía" data-precio="15">
                <img src="productos/SANDIA.jpg" alt="Gomitas con Sandía">
                <p>Sandía</p>
                <p><strong>$15</strong></p>
                <button onclick="agregarAlCarrito('Chamoy', 15)">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
        </div>

        <div id="carrito">
            <h3><i class="fas fa-shopping-cart"></i> Tu Carrito</h3>
            <ul id="lista-carrito"></ul>
            <div id="total">Total: $0</div>
            <h3><i class="fas fa-phone"></i> Agrega tu número de teléfono para confirmar pedido</h3>
            <input type="tel" id="telefono" placeholder="Tu número de teléfono">
            <button id="enviar" onclick="enviarPedido()">
                <i class="fas fa-paper-plane"></i> Enviar Pedido
            </button>
        </div>
    </div>

    <script>
        let carrito = [];
        let total = 0;

        function agregarAlCarrito(sabor, precio) {
            carrito.push({ sabor, precio });
            total += precio;
            actualizarCarrito();
            
            // Animación de confirmación
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.backgroundColor = '#e3a45b';
            toast.style.color = 'white';
            toast.style.padding = '10px 20px';
            toast.style.borderRadius = '5px';
            toast.style.boxShadow = '0 3px 10px rgba(0,0,0,0.2)';
            toast.style.zIndex = '1000';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> Agregado: ${sabor}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 500);
            }, 2000);
        }

        function actualizarCarrito() {
            const listaCarrito = document.getElementById('lista-carrito');
            const totalElemento = document.getElementById('total');
            
            listaCarrito.innerHTML = '';
            
            if (carrito.length === 0) {
                const li = document.createElement('li');
                li.innerHTML = '<em>Tu carrito está vacío</em>';
                li.style.textAlign = 'center';
                li.style.color = '#999';
                li.style.padding = '20px';
                listaCarrito.appendChild(li);
            } else {
                carrito.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${item.sabor} - <strong>$${item.precio}</strong></span>
                        <button onclick="eliminarDelCarrito(${index})">
                            <i class="fas fa-trash"></i>
                        </button>`;
                    listaCarrito.appendChild(li);
                });
            }

            totalElemento.textContent = `Total: $${total}`;
        }

        function eliminarDelCarrito(index) {
            total -= carrito[index].precio;
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert('Tu carrito está vacío');
                return;
            }

            let telefono = document.getElementById('telefono').value.trim();
            if (telefono === '') {
                alert('Por favor, ingresa tu número de teléfono');
                return;
            }

            let mensaje = `Nuevo Pedido:\nTeléfono: ${telefono}\n\nDetalles:\n`;
            carrito.forEach(item => {
                mensaje += `- ${item.sabor} ($${item.precio})\n`;
            });
            mensaje += `\nTotal: $${total}`;

            alert(mensaje);
            
            // Mensaje de confirmación
            const confirmacion = document.createElement('div');
            confirmacion.style.position = 'fixed';
            confirmacion.style.top = '0';
            confirmacion.style.left = '0';
            confirmacion.style.width = '100%';
            confirmacion.style.height = '100%';
            confirmacion.style.backgroundColor = 'rgba(0,0,0,0.8)';
            confirmacion.style.display = 'flex';
            confirmacion.style.justifyContent = 'center';
            confirmacion.style.alignItems = 'center';
            confirmacion.style.zIndex = '2000';
            
            const contenido = document.createElement('div');
            contenido.style.backgroundColor = 'white';
            contenido.style.padding = '30px';
            contenido.style.borderRadius = '10px';
            contenido.style.textAlign = 'center';
            contenido.style.maxWidth = '80%';
            contenido.innerHTML = `
                <i class="fas fa-check-circle" style="color: #f87451; font-size: 3rem; margin-bottom: 15px;"></i>
                <h2 style="color: #f87451;">¡Pedido Enviado!</h2>
                <p style="margin: 15px 0;">Nos comunicaremos contigo pronto al:</p>
                <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;">${telefono}</p>
                <button id="cerrar-confirmacion" style="background-color: #e3a45b; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;">Cerrar</button>
            `;
            
            confirmacion.appendChild(contenido);
            document.body.appendChild(confirmacion);
            
            document.getElementById('cerrar-confirmacion').addEventListener('click', function() {
                document.body.removeChild(confirmacion);
            });
            
            // Limpiar carrito
            carrito = [];
            total = 0;
            actualizarCarrito();
            document.getElementById('telefono').value = '';
        }

        // Inicializar carrito vacío al cargar
        window.onload = function() {
            actualizarCarrito();
        };
    </script>
</body>
</html>
